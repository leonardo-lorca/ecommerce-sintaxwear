<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SintaxWear - Tênis e Sneakers Online</title>
  <meta name="description"
    content="Compre os melhores  tênis e sneakers online na SintaxWear. Encontre modelos exclusivos, ofertas imperdiveis e frete grátis para todo o Brasil.">

  <!-- CSS Reset, Base e Layout -->
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <!-- Componentes CSS -->
  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-category.css">
  <link rel="stylesheet" href="./css/components/product-grid.css">
  <link rel="stylesheet" href="./css/components/footer.css">
</head>

<!--conteúdo da página -->

<body>
  <header class="header">
    <!--logo e navegação-->
    <h1 class="logo">
      <!-- "/" no href clicar e voltar para a raiz-->
      <a href="/" title="SintaxWear - Tênis e Sneakers Online">
        <img src="./images/logo/logo.svg" alt="SintaxWear - Tênis e Sneakers Online">
      </a>
    </h1>
    <nav class="nav-center" aria-label="Categorias Principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>
    <!--# serve para marcação de links futuros a serem preenchidos-->

    <nav class="nav-right" aria-label="Acesso rápido">
      <ul>
        <li><a href="#">Nossas lojas</a></li>
        <li><a href="#  ">Sobre</a></li>
        <li>
          <a href="#" aria-label="Minha conta">
            <img src="./images/icons/user.svg" alt="Minha conta">
          </a>
        </li>
        <li>
          <a href="#" aria-label="Ajuda">
            <img src="./images/icons/help.svg" alt="Ajuda">
          </a>
        </li>
        <li>
          <a href="#" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Carrinho">
          </a>
        </li>
      </ul>
    </nav>

    <!--seção principal-->
  </header>

  <main>
    <!--seção hero-->
    <section class="hero-section">
      <div class="hero-overlay">
        <div class="hero-content">
          <span class="hero-subtitle">Krypton One</span>
          <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
          <div class="hero-buttons">
            <a class="btn btn-outline" href="#">Ver modelos</a>
            <a class="btn btn-filled" href="#">Comprar</a>
          </div>
        </div>
    </section>

    <!--seção de categorias de tenis-->
    <section class="categories-section">
      <div class="category-card casual">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Casual</span>
      </div>
      <div class="category-card esporte">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Esporte</span>
      </div>
      <div class="category-card moderno">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Moderno</span>
      </div>
      <div class="category-card futurista">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Futurista</span>
      </div>
      </div>
    </section>

    <!--grid produtos em destaque-->
    <section class="products-section container" id="produtos-destaque">
      <div class="product-grid"></div>
    </section>
  </main>

  <!--rodapé informações de contatos e links-->
  <footer class="footer">
    <div class="container footer__container">
      <address class="footer__contact"></address>
      <nav class="footer__links"></nav>
    </div>
  </footer>

</body>

</html>
