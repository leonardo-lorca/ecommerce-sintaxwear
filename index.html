<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SintaxWear - E-commerce</title>

  <!-- CSS Reset, Base e Layout -->
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">

  <!-- Componentes CSS -->
  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/product-card.css">
  <link rel="stylesheet" href="./css/components/product-grid.css">
  <link rel="stylesheet" href="./css/components/footer.css">
</head>

<!--conteúdo da página -->

<body>
<h1> titulo</h1>
  <!--logo e navegação-->
  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="header__logo"></a>
      <nav class="header__nav"></nav>
    </div>
  </header>

  <!--seção principal-->
  <main>
    <section class="hero">
      <div class="container hero__content"></div>
    </section>

    <!--seção de categorias de tenis-->
    <section class="categories-section container" id="categorias-tenis">
      <div class="categories-grid"></div>
    </section>

    <!--grid produtos em destaque-->
    <section class="products-section container" id="produtos-destaque">
      <div class="product-grid"></div>
    </section>
  </main>

  <!--rodapé informações de contatos e links-->
  <footer class="footer">
    <div class="container footer__container">
      <address class="footer__contact"></address>
      <nav class="footer__links"></nav>
    </div>
  </footer>

</body>

</html>
